<!doctype html>
<html lang="zh-CN" data-page-node-id="rlDQ2swnLwb91yeBb7iP0I">
  <head data-page-node-id="LPUiN2HG15bifNtd1sNOQT">
    <meta charset="UTF-8" data-page-node-id="jKEYNFPHKYLWhtk0ea7iJE" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="CZnccWw0WNkkNqHSyOzsCR" />
    <title>Listing Studio · Amazon Preview（三窗口版）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" data-page-node-id="d8JBUNP4m6PpuknP7omACL" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin data-page-node-id="r4EKsMlmcYZFjGGfkGUbkW" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" data-page-node-id="DryFreApLD3EmCwvWMO7HA" />
    <link rel="stylesheet" href="styles.css" data-page-node-id="hTxLXZeuaoGVA6mX4nCDGu" />
  </head>
  <body data-page-node-id="ogCGWW0jC1u4hbSLERrDnS">
    <main class="workspace" data-page-node-id="L6wiYATlAumIzQF5hf78Hq">
      <aside class="control-panel" data-page-node-id="tzW0Auc2QQIf79lzUtdtiD">
        <div class="brand-lockup" data-page-node-id="704BHY3PS4pTAqgTlagcQt"><span class="brand-mark" data-page-node-id="lKl8nlosbLifmCZT65iOZ7"></span><span data-page-node-id="IzE7tHgCwcS9YFGsj0dtoS">LISTING / STUDIO</span></div>
        <div class="intro" data-page-node-id="osJUzyg5cP9TibaPWN7YwR">
          <p class="eyebrow" data-page-node-id="jgZx5hRvJjm0QWoU8wyS6d">LOCAL PREVIEWER / 02</p>
          <h1 data-page-node-id="zAjHHkeUTCRsVb8HDHBJ6I">从素材到<br  data-page-node-id="PBVgh0V5Op7fFQc11ueH9Q"/><em data-page-node-id="b3ADZ19u9Ww3k8tGRR5eBB">上架预览。</em></h1>
          <p class="subcopy" data-page-node-id="GKeFs37yACsuMEiMq8sdac">拖入全部图片，按尺寸自动分到 橱窗 / A+PC / A+APP——差几像素也不丢图。</p>
        </div>

        <!-- SKU 输入小栏目（导出 JPG 顶部会带上这个值） -->
        <div class="sku-field">
          <label class="sku-label" for="sku-input">产品 SKU</label>
          <input id="sku-input" class="sku-input" type="text" placeholder="例如 KF20.0029" autocomplete="off" />
        </div>

        <!-- 导出底色选择：灰白 / 纯黑，SKU 文字随之黑白反相 -->
        <div class="bg-field">
          <label class="bg-label">导出底色</label>
          <div class="bg-options">
            <label class="bg-option">
              <input type="radio" name="export-bg" value="light" checked />
              <span class="bg-swatch bg-light"></span>
              <span class="bg-text">灰白色</span>
            </label>
            <label class="bg-option">
              <input type="radio" name="export-bg" value="middle" />
              <span class="bg-swatch bg-middle"></span>
              <span class="bg-text">中灰色</span>
            </label>
            <label class="bg-option">
              <input type="radio" name="export-bg" value="dark" />
              <span class="bg-swatch bg-dark"></span>
              <span class="bg-text">纯黑色</span>
            </label>
          </div>
        </div>

        <!-- 单一上传窗口：拖入全部图片，按尺寸自动分到橱窗 / A+PC / A+APP -->
        <section class="source-windows">
          <div class="source-window" data-window="all">
            <div class="window-head">
              <span class="window-dot dot-mixed"></span>
              <span class="window-title">上传全部图片</span>
              <span class="window-spec">按尺寸自动分类</span>
            </div>
            <div class="window-drop" data-drop="all">
              <input type="file" id="file-all" accept="image/*" multiple hidden />
              <input type="file" id="folder-all" accept="image/*" webkitdirectory directory multiple hidden />
              <span class="window-hint">拖入图片，或</span>
              <span class="window-actions">
                <label class="window-choice" for="file-all">选择图片</label>
                <label class="window-choice" for="folder-all">选择文件夹</label>
              </span>
              <div class="window-legend">
                <span class="legend-item"><i class="dot-orange"></i>橱窗 1500×1500</span>
                <span class="legend-item"><i class="dot-purple"></i>A+PC 1464×600</span>
                <span class="legend-item"><i class="dot-blue"></i>A+APP 1200×900</span>
              </div>
              <div class="window-thumbs" id="thumbs-all"></div>
            </div>
            <div class="window-foot">
              <span class="window-count" id="count-all">0 IMAGES</span>
              <button class="window-clear" type="button" data-clear="all">清空</button>
            </div>
          </div>
        </section>

        <div class="panel-footer" data-page-node-id="QHIyBbbMivnyFAuRayDMvy">
          <button class="clear-all" id="clear-all" type="button" data-page-node-id="NdSQ0Nt5x3Y3AXflVZeYKV">清空全部 <span data-page-node-id="ObYtjpYbSGsycbFEiDItdG">↗</span></button>
        </div>
      </aside>

      <section class="preview-stage" data-page-node-id="KQwQGAK5Yx9P8ZcPVSaIkQ">
        <header class="stage-header" data-page-node-id="VNpUOfGhYVx3c06DpLPlLm">
          <div data-page-node-id="tig6dOQtv05Rl6U6M5q78k"><span class="status-dot" data-page-node-id="tDCWIWxmWmfwO5wcBIk3CA"></span><span data-page-node-id="jQHcdCrd9IbzlTSq9JurO8">LIVE PREVIEW</span></div>
          <div class="stage-actions" data-page-node-id="VXxjfdlg78eqPM67uAaTz9">
            <span class="stage-meta" data-page-node-id="bdiGOa0StoUzJYI7XBLAQg">AMAZON DETAIL PAGE / DESKTOP</span>
            <button class="download-button" id="download-button" type="button" data-page-node-id="U60jvje5s0OntzDZRJoKUE">下载 JPG <span data-page-node-id="35FIH9Cf5giAlnYD90BwrS">↓</span></button>
          </div>
        </header>

        <div class="listing-page" id="listing-page" data-page-node-id="gd551Hq4EFZGGGGoK3xntg">
          <div class="listing-topbar" data-page-node-id="EW4NkQQehR60KwYKBMOt4l">
            <span class="amazon-word" data-page-node-id="HuHImxSgo0oeTkcBlxG2Ed">amazon</span>
            <span class="topbar-search" data-page-node-id="g0NBuIOABM9lyQi5MJV7YD"></span>
            <span class="topbar-icons" data-page-node-id="QHIVxF6ugDPyD2CoAGMUaj">⌁　◌　▢</span>
          </div>

          <div class="product-view" data-page-node-id="VjG6Vh1kHoPbUEiEbzEvFa">
            <div class="gallery-column" data-page-node-id="SopPEJcIzvoIl9VivChnKr">
              <div class="thumb-rail" id="listing-thumbs" data-page-node-id="GvF74GL3YHmjrCir6sXgk0"></div>
              <div class="hero-frame" id="listing-hero" data-page-node-id="xjTTjirXrx1ZCJhXJpfBy1"><div class="empty-frame" data-page-node-id="DsB447Xn4N6pWvBctHtKNf">等待橱窗图</div></div>
            </div>
            <div class="product-ghost" data-page-node-id="WkUSMgKxQ7becQZ36xNp5U">
              <div class="ghost-line long" data-page-node-id="5X9yboPWSFyXZwC0LCMkZh"></div>
              <div class="ghost-line medium" data-page-node-id="qPOBQwLr6Yb3R0p3CTYw5A"></div>
              <div class="ghost-line short" data-page-node-id="eG17aeBnmSdj4X2JTuBNWl"></div>
              <div class="ghost-block" data-page-node-id="czjFdqRi8maRI2F8dEFioK"></div>
              <div class="ghost-line medium" data-page-node-id="q645dyFRAUUCFyvvI6qjMR"></div>
            </div>
          </div>

          <div class="aplus-preview" data-page-node-id="KCVaG0AzFLqriEPRfNaIUm">
            <div class="section-marker" data-page-node-id="mIge1FVsPLnhnDhDkaD4oA"><span data-page-node-id="Ymy2EIgWE25zgPm7BrBUpl">A+ CONTENT</span><i data-page-node-id="Yosof0IhN21jlk2eWkysFA"></i></div>
            <div class="aplus-groups" id="aplus-groups" data-page-node-id="9fFziLLhTY48bXLoZLsSsw">
              <div class="aplus-empty" data-page-node-id="ruRI4IVVcUcOXZYpMlUZGD">等待 A+ PC 图片</div>
            </div>
          </div>

          <section class="mobile-preview-shell" data-page-node-id="ym49mCZ5vEPOcXS6NGAdxD">
            <div class="mobile-preview-heading" data-page-node-id="7CbGo4Vcg2Y7bCVzP2fEmU">
              <span data-page-node-id="fVqM2LNKzJk8NWIWdfMArE">APP PREVIEW</span><i data-page-node-id="O9mq4WLNI6E5Z3fy6pXIIU"></i><small data-page-node-id="0w3VWHYBVsHcOABmA3mQrI">1200 × 900</small>
            </div>
            <div class="mobile-preview" id="mobile-preview" data-page-node-id="CzhnTgZEG4dKJHV40SwJsl">
              <div class="mobile-empty" data-page-node-id="uE6u0Rrs0RNWzj6NB0htYk">等待 A+ APP 图片</div>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
